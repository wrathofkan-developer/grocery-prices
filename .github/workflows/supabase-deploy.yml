name: Deploy database

# Applies database changes, deploys the Kroger function and its secrets, and
# loads the current store data. Runs when anything under supabase/ changes,
# or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'docs/config.js', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check setup
        id: cfg
        run: |
          REF=$(node -e "const m=require('fs').readFileSync('docs/config.js','utf8').match(/https:\/\/([a-z0-9]+)\.supabase\.co/); console.log(m?m[1]:'')")
          if [ -z "$REF" ]; then echo "::warning::docs/config.js has no Supabase URL yet; nothing to deploy."; echo "ready=false" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets."; exit 1; fi
          echo "REF=$REF" >> $GITHUB_ENV
          echo "ready=true" >> $GITHUB_OUTPUT

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest

      - name: Apply database changes
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"

      - name: Kroger secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
        run: |
          if [ -z "$KROGER_CLIENT_ID" ] || [ -z "$KROGER_CLIENT_SECRET" ]; then echo "::warning::Kroger secrets not set; Kroger stores will be unavailable."; exit 0; fi
          supabase secrets set --project-ref "$REF" KROGER_CLIENT_ID="$KROGER_CLIENT_ID" KROGER_CLIENT_SECRET="$KROGER_CLIENT_SECRET"

      - name: Deploy Kroger function
        if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy kroger --project-ref "$REF" --no-verify-jwt

      - name: Load store data
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm ci
          node src/sync-db.js
