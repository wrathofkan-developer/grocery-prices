name: Fetch prices

# Runs just after midnight Pacific, when new ads start (Safeway Wed, Costco Mon).
# The app decides what's active by each ad's start/end date, so an early fetch is
# harmless and an already-fetched upcoming ad switches on at midnight by itself.
# GitHub schedules in UTC, so two runs an hour apart keep one just after midnight
# all year: summer (PDT) 12:10am + 1:10am, winter (PST) 11:10pm + 12:10am.
on:
  schedule:
    - cron: '10 7 * * *'
    - cron: '10 8 * * *'
  workflow_dispatch:
    inputs:
      chains:
        description: 'Stores to fetch (space-separated)'
        default: 'safeway traderjoes costco'

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch
        env:
          FETCH_RUNNER: github
        run: node src/run.js ${{ github.event.inputs.chains || 'safeway traderjoes costco' }}
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update prices $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - name: Sync to database
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/sync-db.js ${{ github.event.inputs.chains || 'safeway traderjoes costco' }}
