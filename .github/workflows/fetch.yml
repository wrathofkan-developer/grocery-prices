name: Fetch prices

# Runs twice a day. Ads are posted a day early (e.g. Safeway posts Tue, starts Wed);
# the app decides what's active by each ad's start/end date, so an early fetch is
# harmless and a late one still switches on time.
on:
  schedule:
    - cron: '17 13 * * *'   # ~6:17am Pacific (5:17am in winter)
    - cron: '17 1 * * *'    # ~6:17pm Pacific (5:17pm in winter)
  workflow_dispatch:
    inputs:
      chains:
        description: 'Stores to fetch (space-separated)'
        default: 'safeway traderjoes costco'

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch
        env:
          FETCH_RUNNER: github
        run: node src/run.js ${{ github.event.inputs.chains || 'safeway traderjoes costco' }}
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update prices $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
